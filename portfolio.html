<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="fa/css/all.min.css">
<link rel="preload" href="fonts/bebas-neue-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/dm-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
  /* Seasonal theme, picked from the visitor's own date before the first paint (portfolio page only):
       Halloween   Oct 1 – Nov 1        Christmas  Dec 1 – Dec 31      New Year  Jan 1 – Jan 2
       St. Patrick's Day  Mar 17 only   4th of July  Jul 4 only
     Preview any of them with ?season=halloween|christmas|newyear|stpatricks|july4  (or ?season=off to see the normal look). */
  (function () {
    var NAMES = { halloween: 1, christmas: 1, newyear: 1, stpatricks: 1, july4: 1 };
    function seasonFor(d) {
      var m = d.getMonth() + 1, day = d.getDate();
      if (m === 10 || (m === 11 && day === 1)) return 'halloween';
      if (m === 12) return 'christmas';
      if (m === 1 && day <= 2) return 'newyear';
      if (m === 3 && day === 17) return 'stpatricks';
      if (m === 7 && day === 4) return 'july4';
      return '';
    }
    var s = seasonFor(new Date());
    try {
      var q = new URLSearchParams(location.search).get('season');
      if (q === 'off') s = ''; else if (q && NAMES[q]) s = q;
    } catch (e) {}
    /* The holiday theme is off by default; the button at the bottom right turns it on (remembered). ?season=name forces it on for a visit. */
    var forced = false, seasonOff = false;
    try { forced = !!new URLSearchParams(location.search).get('season'); seasonOff = !forced && localStorage.getItem('portfolio-season') !== 'on'; } catch (e) { seasonOff = true; }   // off by default; the button turns it on
    if (s) document.documentElement.setAttribute('data-season-name', s);
    if (s && !seasonOff) document.documentElement.setAttribute('data-season', s);
    /* Tilted UI (portfolio page only): on by default for laptops and desktops (a mouse and room to hover), off by default for phones and tablets.
       A choice made with the button at the bottom right is remembered.  ?tilt=off|on overrides for a visit. */
    var tilt = 'off';
    try { if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) tilt = 'on'; } catch (e) {}
    try { var ts = localStorage.getItem('portfolio-tilt'); if (ts === 'on' || ts === 'off') tilt = ts; } catch (e) {}
    try { var tq = new URLSearchParams(location.search).get('tilt'); if (tq === 'off' || tq === 'on') tilt = tq; } catch (e) {}
    document.documentElement.setAttribute('data-tilt', tilt);
  })();
  </script>
  <title>Project Registry — Compatibility Overview</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-top:    #0d0d0f;
      --bg-bottom: #080810;
      --surface:   #111114;
      --border:    #1e1e24;
      --text:      #e8e8e8;
      --muted:     #8a8a9a;
      --accent:    #c8ff00;
      --accent-rgb: 200,255,0;
      --accent-hover: #d6ff3a;
      --accent2:   #8a8a9a;
      --card-hover:#17171c;
      --tag-bg:    #1a1a22;
      --radius:    10px;

      /* category colors */
      --cat-web:   var(--accent);
      --cat-shop:  #e8e8e8;
      --status-complete: #3ddc6a;
      --status-active:   #e8e8e8;
      --status-wip:      #ff9f1c;
      --status-retired:  #5a5a66;
    }


    /* ── SEASONAL THEMES (set by the date script in <head>) ── */
    [data-season="halloween"] { --bg-top:#150b20; --bg-bottom:#07040d; --surface:#1a1126; --border:#31204a; --text:#f0e8f7; --muted:#a591bd; --accent:#ff8a1f; --accent-rgb:255,138,31; --accent-hover:#ffa347; --accent2:#a66bff; --card-hover:#21162f; --tag-bg:#271a3a; }
    [data-season="christmas"]  { --bg-top:#0c1712; --bg-bottom:#050a08; --surface:#112019; --border:#244636; --text:#f2f7f3; --muted:#8fb0a0; --accent:#ff4d5a; --accent-rgb:255,77,90; --accent-hover:#ff7280; --accent2:#3ddc84; --card-hover:#162a20; --tag-bg:#1a3226; }
    [data-season="newyear"]    { --bg-top:#100e1a; --bg-bottom:#06050c; --surface:#16132a; --border:#2d2850; --text:#f3f1fb; --muted:#9a95bd; --accent:#ffd24a; --accent-rgb:255,210,74; --accent-hover:#ffe07a; --accent2:#c9d3ff; --card-hover:#1c1836; --tag-bg:#221e40; }
    [data-season="stpatricks"] { --bg-top:#08150c; --bg-bottom:#040a06; --surface:#0f1d13; --border:#1f4128; --text:#eef8f0; --muted:#86ad90; --accent:#3ddc6a; --accent-rgb:61,220,106; --accent-hover:#6af08e; --accent2:#ffd24a; --card-hover:#14261a; --tag-bg:#183222; }
    [data-season="july4"]      { --bg-top:#0a0f22; --bg-bottom:#04060f; --surface:#101734; --border:#26325f; --text:#f2f4fc; --muted:#8f9ac4; --accent:#ff4d5e; --accent-rgb:255,77,94; --accent-hover:#ff7584; --accent2:#4d8dff; --card-hover:#152043; --tag-bg:#1a2650; }

    .season-banner {
      display: none; align-items: center; gap: 10px; width: fit-content; max-width: 100%;
      margin-bottom: 18px; padding: 8px 16px; border-radius: 999px;
      border: 1px solid rgba(var(--accent-rgb), 0.55);
      background: linear-gradient(90deg, rgba(var(--accent-rgb), 0.16), transparent);
      color: var(--text); font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase;
      box-shadow: 0 0 22px rgba(var(--accent-rgb), 0.18);
    }
    [data-season] .season-banner { display: inline-flex; }
    .season-banner b { color: var(--accent); font-weight: 500; }
    [data-season] .main-header h1 span { -webkit-text-stroke-color: var(--accent2); }

    /* floating decorations: sparse, above the page, never block a click */
    #seasonFx { position: fixed; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }
    #seasonFx i {
      position: absolute; top: -8vh; font-style: normal; line-height: 1; opacity: 0.85;
      filter: drop-shadow(0 0 6px rgba(var(--accent-rgb), 0.35));
      animation: seasonFall linear infinite;
    }
    #seasonFx.twinkle i { top: auto; animation-name: seasonTwinkle; animation-timing-function: ease-in-out; }
    @keyframes seasonFall {
      0%   { transform: translate3d(0, -8vh, 0) rotate(0deg); }
      50%  { transform: translate3d(var(--sway, 24px), 54vh, 0) rotate(var(--spin, 180deg)); }
      100% { transform: translate3d(calc(var(--sway, 24px) * -0.6), 112vh, 0) rotate(calc(var(--spin, 180deg) * 2)); }
    }
    @keyframes seasonTwinkle {
      0%, 100% { transform: scale(0.55); opacity: 0.15; }
      50%      { transform: scale(1.15); opacity: 0.95; }
    }
    @media (prefers-reduced-motion: reduce) { #seasonFx { display: none; } }
    .season-toggle {
      display: none; align-items: center; gap: 8px; position: fixed; right: 14px; bottom: 14px; z-index: 60;
      padding: 7px 12px; border-radius: 6px; border: 1px solid var(--border); background: rgba(17,17,20,0.88);
      color: var(--muted); font: 500 0.6rem/1 'DM Sans', sans-serif; letter-spacing: 0.16em; text-transform: uppercase; cursor: pointer;
      backdrop-filter: blur(6px);
    }
    .season-toggle:hover { color: var(--text); border-color: var(--accent); }
    html[data-season-name] .season-toggle { display: inline-flex; }
    /* sit to the left of the tilt button when it is showing (wide screens) */
    @media (min-width: 769px) { html[data-season-name] .season-toggle { right: 150px; } }

    /* ── EXPERIMENTAL: tilted HUD look (a nod to the Division's inventory screen). The project grid on the right floats
          like an AR projection: angled toward the viewer, dark see-through panels, orange highlights, faint scanlines.
          Off switch: the button at the bottom right (remembered), or ?tilt=off.  Only on screens wide enough for the sidebar. ── */
    .tilt-toggle { display: none; }
    @media (min-width: 769px) {
      /* the Division's orange, unless a holiday theme is choosing the colors */
      html[data-tilt="on"]:not([data-season]) { --accent:#ff6d10; --accent-rgb:255,109,16; --accent-hover:#ff8a3d; --cat-web:#ff6d10; }
      html[data-tilt="on"] body {
        background:
          radial-gradient(ellipse 55% 70% at 18% 42%, rgba(var(--accent-rgb), 0.07), transparent 70%),
          radial-gradient(ellipse 60% 80% at 72% 55%, rgba(255,255,255,0.025), transparent 70%),
          linear-gradient(160deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
        background-attachment: fixed;
      }
      html[data-tilt="on"] .page { overflow-x: clip; perspective: 1500px; perspective-origin: 30% var(--tilt-py, 480px); }   /* --tilt-py keeps the vanishing point at the same spot on the screen while scrolling, so the tilt looks identical everywhere */
      /* the projection: hinged on its left edge, the right side swung out toward the viewer */
      html[data-tilt="on"] .main {
        position: relative;
        transform: rotateY(-11deg) scale(var(--tilt-s, 0.92));   /* fixed angle; only the scale is fitted (by script) so no card runs off the screen */
        transform-origin: 0% 480px; will-change: transform;
        padding-right: 64px;
      }
      /* scanlines and a soft edge glow over the whole projection, never blocking a click */
      html[data-tilt="on"] .main::before {
        content: ''; position: absolute; inset: 0; z-index: 3; pointer-events: none;
        background: repeating-linear-gradient(180deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 3px);
        mix-blend-mode: screen;
      }
      /* the left side mirrors it: hinged on its right edge, the left side swung out toward the viewer */
      html[data-tilt="on"] .sidebar {
        transform: rotateY(11deg) scale(var(--tilt-sb, 0.94)); transform-origin: 100% 50%;
        background: rgba(18,18,22,0.5);
        backdrop-filter: blur(6px) saturate(1.1); -webkit-backdrop-filter: blur(6px) saturate(1.1);
        border-right-color: rgba(var(--accent-rgb), 0.35);
        box-shadow: inset -1px 0 0 rgba(255,255,255,0.04), 0 18px 40px rgba(0,0,0,0.35);
      }

      html[data-tilt="on"] .sidebar::before {
        content: ''; position: absolute; inset: 0; z-index: 3; pointer-events: none;
        background: repeating-linear-gradient(180deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 3px);
        mix-blend-mode: screen;
      }
      html[data-tilt="on"] .chip {
        background: rgba(18,18,22,0.55); border-color: rgba(255,255,255,0.09);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
      }
      html[data-tilt="on"] .chip:hover {
        border-color: rgba(var(--accent-rgb), 0.85); background: rgba(var(--accent-rgb), 0.08); color: var(--text);
        box-shadow: 0 0 0 1px rgba(var(--accent-rgb), 0.3), 0 0 18px rgba(var(--accent-rgb), 0.2);
      }
      html[data-tilt="on"] .chip.on { box-shadow: inset 3px 0 0 var(--chip-color, var(--accent)), 0 0 14px rgba(var(--accent-rgb), 0.12); }
      html[data-tilt="on"] .filter-title::after { background: linear-gradient(90deg, rgba(var(--accent-rgb), 0.6), rgba(255,255,255,0.06) 60%); }
      html[data-tilt="on"] .sidebar-logo .title-underline { background: linear-gradient(90deg, var(--accent) 0%, transparent 100%); opacity: 0.7; }

      /* panels: dark, see-through, square-cornered */
      html[data-tilt="on"] .featured-card,
      html[data-tilt="on"] .project-card {
        background: rgba(18,18,22,0.55);
        backdrop-filter: blur(6px) saturate(1.1); -webkit-backdrop-filter: blur(6px) saturate(1.1);
        border: 1px solid rgba(255,255,255,0.09);
        border-radius: 3px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 18px 40px rgba(0,0,0,0.35);
      }
      html[data-tilt="on"] .fc-preview { background: rgba(8,8,12,0.6); border-bottom-color: rgba(255,255,255,0.07); }
      /* orange corner tick on every panel, like the item slots */
      html[data-tilt="on"] .featured-card::before {
        content: ''; position: absolute; left: 0; bottom: 0; z-index: 4; width: 4px; height: 22px;
        background: var(--accent); opacity: 0.85; pointer-events: none;
      }
      /* the selected slot: orange glow and edge */
      html[data-tilt="on"] .featured-card:hover,
      html[data-tilt="on"] .project-card[href]:hover {
        border-color: rgba(var(--accent-rgb), 0.85);
        background: rgba(var(--accent-rgb), 0.08);
        box-shadow: 0 0 0 1px rgba(var(--accent-rgb), 0.35), 0 0 28px rgba(var(--accent-rgb), 0.25), inset 0 0 40px rgba(var(--accent-rgb), 0.08);
        transform: translateZ(14px);
      }
      html[data-tilt="on"] .featured-card:hover .fc-body { background: linear-gradient(180deg, rgba(var(--accent-rgb), 0.18), rgba(var(--accent-rgb), 0.04)); }
      html[data-tilt="on"] .pv-badge,
      html[data-tilt="on"] .open-btn,
      html[data-tilt="on"] .chip,
      html[data-tilt="on"] .clear-btn { border-radius: 2px; }
      html[data-tilt="on"] .featured-head::after,
      html[data-tilt="on"] .section-label::after { background: linear-gradient(90deg, rgba(var(--accent-rgb), 0.6), rgba(255,255,255,0.06) 40%); }

      .tilt-toggle {
        display: inline-flex; align-items: center; gap: 8px; position: fixed; right: 14px; bottom: 14px; z-index: 60;
        padding: 7px 12px; border-radius: 6px; border: 1px solid var(--border); background: rgba(17,17,20,0.88);
        color: var(--muted); font: 500 0.6rem/1 'DM Sans', sans-serif; letter-spacing: 0.16em; text-transform: uppercase; cursor: pointer;
        backdrop-filter: blur(6px);
      }
      .tilt-toggle:hover { color: var(--text); border-color: var(--accent); }
      .tilt-toggle .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
      html[data-tilt="on"] .tilt-toggle .dot { background: var(--accent); box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.7); }
    }
    @media (prefers-reduced-motion: reduce) { html[data-tilt="on"] .main { will-change: auto; } }

    html { scroll-behavior: smooth; }

    body {
      background: linear-gradient(160deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      background-attachment: fixed;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
    }

    .page { display: flex; min-height: 100vh; position: relative; z-index: 1; }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 240px; flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 32px 0;
      position: sticky; top: 0; height: 100vh;
      overflow-y: auto;
      display: flex; flex-direction: column;
    }
    .sidebar::-webkit-scrollbar { width: 3px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .sidebar-logo {
      padding: 0 24px 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
    }
    .logo-tag {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.6rem; letter-spacing: 0.18em; color: var(--muted);
      text-transform: uppercase; margin-bottom: 10px;
    }
    .sidebar-logo h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.2rem; font-weight: 400;
      text-transform: uppercase; letter-spacing: 0.04em; line-height: 0.9;
      color: var(--text);
    }
    .sidebar-logo h2 span {
      display: block;
      color: transparent;
      -webkit-text-stroke: 1.2px var(--text);
    }
    .sidebar-logo .title-underline {
      width: 100%;
      height: 1.5px;
      background: linear-gradient(90deg, var(--text) 0%, transparent 100%);
      margin-top: 0.7rem;
      opacity: 0.4;
    }

    .filter-section {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
    }
    .filter-title {
      font-size: 0.6rem; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--muted);
      margin-bottom: 12px;
      display: flex; align-items: center; gap: 8px;
    }
    .filter-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    .chip-list { display: flex; flex-direction: column; gap: 6px; }

    .chip {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem; font-weight: 500;
      letter-spacing: 0.06em; text-transform: uppercase;
      cursor: pointer; text-align: left; width: 100%;
      transition: all 0.2s;
      position: relative; overflow: hidden;
    }
    .chip:hover { border-color: var(--border); color: var(--text); background: var(--card-hover); }
    .chip.on {
      border-color: var(--chip-color, var(--accent));
      color: var(--chip-color, var(--accent));
      background: transparent;
    }
    .chip.on::after {
      content: ''; position: absolute; inset: 0;
      background: var(--chip-color, var(--accent)); opacity: 0.06;
      pointer-events: none;
    }

    .chip-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--chip-color, var(--muted)); opacity: 0.35; flex-shrink: 0;
      transition: opacity 0.2s;
    }
    .chip.on .chip-dot { opacity: 1; }
    .chip-label { flex: 1; }
    .chip-count {
      font-size: 0.58rem; color: var(--muted);
      background: var(--tag-bg); padding: 1px 7px; border-radius: 20px;
      transition: all 0.2s;
    }
    .chip.on .chip-count { background: var(--chip-color, var(--accent)); color: #0d0d0f; }
    .chip-check { font-size: 0.7rem; opacity: 0; transition: opacity 0.2s; color: var(--chip-color, var(--accent)); }
    .chip.on .chip-check { opacity: 1; }

    .clear-btn {
      margin: 16px 24px 0;
      padding: 10px 14px;
      background: transparent;
      border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase;
      cursor: pointer; width: calc(100% - 48px);
      transition: all 0.2s;
    }
    .clear-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── MAIN ── */
    .main { flex: 1; padding: 48px 40px 80px; min-width: 0; }

    .main-header {
      margin-bottom: 32px;
      opacity: 0; animation: fadeUp 0.7s ease forwards 0.1s;
    }
    .main-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.6rem, 6vw, 4.2rem);
      font-weight: 400;
      text-transform: uppercase; letter-spacing: 0.04em; line-height: 0.86;
      color: var(--text);
    }
    .main-header h1 span {
      display: block;
      color: transparent;
      -webkit-text-stroke: 1.5px var(--text);
    }
    .header-underline {
      width: 100%; max-width: 340px;
      height: 1.5px;
      background: linear-gradient(90deg, var(--text) 0%, transparent 100%);
      margin-top: 0.6rem;
      opacity: 0.4;
    }
    .header-meta {
      display: flex; align-items: center; gap: 16px; margin-top: 14px; flex-wrap: wrap;
    }
    .meta-item {
      font-size: 0.6rem; letter-spacing: 0.14em; color: var(--muted); text-transform: uppercase;
    }
    .meta-div { width: 1px; height: 12px; background: var(--border); }

    .tag-bar {
      display: flex; flex-wrap: wrap; gap: 6px;
      min-height: 24px; margin-bottom: 14px;
      opacity: 0; animation: fadeUp 0.7s ease forwards 0.2s;
    }
    .atag {
      font-size: 0.58rem; letter-spacing: 0.1em;
      padding: 3px 10px; border-radius: 4px; text-transform: uppercase;
      display: flex; align-items: center; gap: 5px;
      animation: pop 0.18s ease;
      font-family: 'DM Sans', sans-serif; font-weight: 500;
    }
    @keyframes pop { from { transform: scale(0.75); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .atag-x { cursor: pointer; opacity: 0.55; transition: opacity 0.15s; font-size: 0.65rem; }
    .atag-x:hover { opacity: 1; }

    .result-count {
      font-size: 0.6rem; color: var(--muted); letter-spacing: 0.14em; text-transform: uppercase;
      margin-bottom: 12px;
      opacity: 0; animation: fadeUp 0.7s ease forwards 0.25s;
    }
    .result-count em { color: var(--accent); font-style: normal; }

    /* ── FEATURED ── */
    .featured {
      margin-bottom: 26px;
      opacity: 0; animation: fadeUp 0.7s ease forwards 0.28s;
    }
    .more-grid { margin-bottom: 14px; }
    .more-grid:empty { display: none; }
    .featured.hide, .featured-card.hide, .section-label.hide { display: none; }

    .featured-head {
      display: flex; align-items: center; gap: 12px; margin-bottom: 14px;
    }
    .featured-head::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .featured-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.7rem; font-weight: 400; line-height: 1;
      text-transform: uppercase; letter-spacing: 0.06em;
      display: flex; align-items: center; gap: 8px;
    }
    .featured-title i { font-style: normal; color: var(--accent); font-size: 1.1rem; }

    .featured-grid {
      display: grid;
      /* always three to a row, so a card keeps the same size however few are showing after filtering */
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    @media (max-width: 1100px) { .featured-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 700px)  { .featured-grid { grid-template-columns: minmax(0, 1fr); } }

    .featured-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      /* the preview keeps a fixed shape; the details below grow so the whole description always shows */
      display: grid; grid-template-rows: auto 1fr;
      position: relative;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
      animation: fadeUp 0.5s ease both;
    }
    .featured-card:hover {
      border-color: #2e2e3a;
      transform: translateY(-2px);
      box-shadow: 0 14px 40px rgba(0,0,0,0.45);
    }
    .featured-card.retired > * { opacity: 0.4; filter: grayscale(1); transition: opacity 0.2s, filter 0.2s; }
    .featured-card.retired:hover > * { opacity: 0.7; }

    /* preview area */
    .fc-preview {
      position: relative; min-height: 0; aspect-ratio: 8 / 7;
      background: #0a0a0e; overflow: hidden;
      border-bottom: 1px solid var(--border);
    }
    .pv-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .pv-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    .pv-badge {
      position: absolute; top: 12px; z-index: 2;
      font-size: 0.55rem; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 500;
      padding: 5px 10px; border-radius: 4px;
      background: rgba(13,13,15,0.72); backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .pv-badge { left: 12px; color: var(--accent); border-color: rgba(var(--accent-rgb),0.35); }

    .fc-body { min-height: 0; padding: 12px 16px 14px; display: flex; flex-direction: column; }
    .fc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
    .fc-name {
      font-size: 1.15rem; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.06em; line-height: 1.1;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .featured-card .fc-desc {
      font-size: 0.82rem; font-weight: 300; color: #c8c8d8;
      margin-top: 6px; line-height: 1.45;
    }
    /* keep the details short: name, full description, Open and status */
    .fc-body .card-tags, .fc-body .card-updated, .fc-body .card-id, .fc-body .fc-meta .compat-row { display: none; }
    .fc-footer {
      margin-top: auto; padding-top: 10px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px 12px; flex-wrap: wrap;
    }
    .fc-meta { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: flex-end; }
    .fc-meta .compat-row { margin-top: 0; border-top: none; padding-top: 0; }

    .open-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 18px;
      background: var(--accent); color: #0d0d0f;
      border: 1px solid var(--accent); border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.72rem; font-weight: 500;
      letter-spacing: 0.16em; text-transform: uppercase;
      text-decoration: none; cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
    }
    /* Open buttons use a plain Font Awesome icon only, never an emoji or arrow character */
    .open-btn .fa-solid { font-size: 0.72em; color: currentColor; }
    .open-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(var(--accent-rgb),0.28); background: var(--accent-hover); }
    .open-btn:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
    .open-btn.disabled {
      background: transparent; color: var(--muted); border-color: var(--border);
      cursor: default; pointer-events: none;
    }

    .section-label {
      font-size: 0.6rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
      margin: 4px 0 12px; display: flex; align-items: center; gap: 8px;
      opacity: 0; animation: fadeUp 0.7s ease forwards 0.3s;
    }
    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* ── PROJECT CARDS ── */
    .cards-wrap {
      opacity: 0; animation: fadeUp 0.7s ease forwards 0.3s;
    }

    .project-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 8px;
      display: flex; align-items: stretch;
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
      overflow: hidden;
      animation: fadeUp 0.5s ease both;
      text-decoration: none;
      color: inherit;
      position: relative;
    }
    .project-card::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(90deg, rgba(var(--accent-rgb),0.04) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .project-card[href]:hover {
      background: var(--card-hover);
      border-color: #2a2a34;
      transform: translateY(-1px);
      cursor: pointer;
    }
    .project-card[href]:hover::after { opacity: 1; }
    .project-card:not([href]):hover { background: var(--card-hover); }
    .project-card.hide { display: none; }

    /* Retired projects: dimmed (applied to children so the card's fadeUp animation doesn't override opacity) */
    .project-card.retired > * {
      opacity: 0.4;
      filter: grayscale(1);
      transition: opacity 0.2s, filter 0.2s;
    }
    .project-card.retired:hover > * { opacity: 0.7; }
    .retired-tag {
      font-size: 0.55rem; letter-spacing: 0.14em; text-transform: uppercase;
      padding: 2px 7px; border-radius: 3px;
      border: 1px solid var(--muted); color: var(--muted);
      font-family: 'DM Sans', sans-serif; font-weight: 500;
      white-space: nowrap;
    }

    .card-accent-bar {
      width: 3px; flex-shrink: 0;
      background: var(--cat-color, var(--accent));
      opacity: 0.7;
    }

    .card-body {
      flex: 1; padding: 18px 22px;
      display: flex; align-items: center; gap: 20px; min-width: 0;
    }

    .card-left { flex: 1; min-width: 0; }

    .card-name {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text); line-height: 1.1;
      display: flex; align-items: center; gap: 8px;
    }
    .card-link-icon {
      font-size: 0.7rem; opacity: 0.3;
      transition: opacity 0.2s;
    }
    .project-card[href]:hover .card-link-icon { opacity: 0.9; color: var(--accent); }

    .card-id {
      font-size: 0.6rem; color: var(--muted); letter-spacing: 0.14em; margin-top: 3px;
      text-transform: uppercase;
    }
    .card-desc {
      font-size: 0.82rem; font-weight: 300; color: #c8c8d8;
      margin-top: 7px; line-height: 1.7;
    }

    .card-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 9px; }

    .card-updated {
      display: flex; align-items: center; gap: 5px;
      margin-top: 9px;
      font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted);
    }
    .card-updated-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--muted); opacity: 0.4; flex-shrink: 0;
    }
    .tag-pill {
      font-size: 0.55rem; letter-spacing: 0.12em; text-transform: uppercase;
      padding: 2px 8px; border-radius: 3px;
      border: 1px solid; opacity: 0.7;
      font-family: 'DM Sans', sans-serif; font-weight: 500;
    }

    .card-right {
      display: flex; flex-direction: column; align-items: flex-end;
      gap: 8px; flex-shrink: 0;
    }

    .cat-badge {
      font-size: 0.58rem; letter-spacing: 0.12em; text-transform: uppercase;
      padding: 4px 10px; border-radius: 4px;
      border: 1px solid var(--cat-color, var(--accent));
      color: var(--cat-color, var(--accent));
      background: transparent; white-space: nowrap;
      position: relative; overflow: hidden;
    }
    .cat-badge::after {
      content: ''; position: absolute; inset: 0;
      background: var(--cat-color, var(--accent)); opacity: 0.07;
    }

    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--status-color, var(--muted));
      box-shadow: 0 0 6px var(--status-color, transparent);
    }

    .status-row {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.58rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted);
    }

    /* ── COMPATIBILITY INDICATORS ── */
    .compat-row {
      display: flex;
      gap: 14px;
      margin-top: 8px;
      padding-top: 4px;
      border-top: 1px dashed var(--border);
    }
    .compat-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.55rem;
      letter-spacing: 0.08em;
      font-weight: 500;
      background: rgba(30,30,36,0.5);
      padding: 3px 8px;
      border-radius: 20px;
      backdrop-filter: blur(2px);
    }
    .compat-label {
      color: var(--muted);
      text-transform: uppercase;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
    }
    .compat-symbol {
      font-weight: bold;
      font-size: 0.7rem;
      line-height: 1;
    }
    .compat-check {
      color: var(--accent);
      text-shadow: 0 0 2px rgba(var(--accent-rgb),0.19);
    }
    .compat-x {
      color: #a0a0b4;
      opacity: 0.7;
    }
    @media (max-width: 768px) {
      .card-right { flex-direction: row; flex-wrap: wrap; justify-content: flex-start; align-items: center; width: 100%; }
      .compat-row { margin-top: 0; border-top: none; padding-left: 0; }
      .compat-item { padding: 2px 7px; }
    }

    /* Stats bar */
    .stats {
      display: flex; gap: 0; margin-top: 24px;
      border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; background: var(--surface);
      opacity: 0; animation: fadeUp 0.7s ease forwards 0.5s;
    }
    .stat {
      flex: 1; padding: 18px 20px;
      border-right: 1px solid var(--border);
      text-align: center;
    }
    .stat:last-child { border-right: none; }
    .stat-n {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.4rem; font-weight: 400;
      color: var(--accent); line-height: 1;
      letter-spacing: 0.04em;
    }
    .stat-l {
      font-size: 0.58rem; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--muted); margin-top: 4px;
    }

    /* Empty state */
    .empty {
      text-align: center; padding: 60px 20px;
      display: none;
    }
    .empty.show { display: block; }
    .empty-icon { font-size: 2.4rem; margin-bottom: 14px; opacity: 0.2; }
    .empty-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem; font-weight: 400;
      text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
    }
    .empty-sub {
      font-size: 0.62rem; color: var(--muted); margin-top: 6px;
      letter-spacing: 0.14em; text-transform: uppercase;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── MOBILE TOP BAR ── */
    .mobile-bar {
      display: none;
      position: sticky; top: 0; z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      align-items: center; justify-content: space-between;
    }
    .mobile-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem; font-weight: 400;
      text-transform: uppercase; letter-spacing: 0.04em;
      color: var(--text); line-height: 1;
    }
    .mobile-logo span {
      color: transparent;
      -webkit-text-stroke: 1px var(--text);
    }
    .filter-toggle-btn {
      display: flex; align-items: center; gap: 7px;
      padding: 8px 14px;
      background: transparent;
      border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase;
      cursor: pointer; transition: all 0.2s; font-weight: 500;
    }
    .filter-toggle-btn.has-filters { border-color: var(--accent); color: var(--accent); }
    .filter-toggle-btn .ftb-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent); display: none;
    }
    .filter-toggle-btn.has-filters .ftb-dot { display: block; }

    /* ── MOBILE DRAWER ── */
    .drawer-overlay {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.65); backdrop-filter: blur(2px);
    }
    .drawer-overlay.open { display: block; }
    .drawer {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 201;
      background: var(--surface); border-top: 1px solid var(--border);
      border-radius: var(--radius) var(--radius) 0 0;
      padding: 0 0 env(safe-area-inset-bottom, 16px);
      max-height: 85vh; overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .drawer.open { transform: translateY(0); }
    /* the filter drawer is for narrow screens only; on wide ones the sidebar does the job (and the tilt's perspective would otherwise pull it up into view) */
    @media (min-width: 769px) { .drawer, .drawer-overlay { display: none !important; } }
    .drawer-handle { width: 36px; height: 3px; border-radius: 2px; background: var(--border); margin: 14px auto 0; }
    .drawer-header {
      padding: 14px 22px 12px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .drawer-title {
      font-size: 0.6rem; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--accent);
    }
    .drawer-close { background: transparent; border: none; color: var(--muted); font-size: 1rem; cursor: pointer; padding: 0 4px; line-height: 1; }
    .drawer-body { padding: 16px 22px 22px; }
    .drawer-section { margin-bottom: 20px; }
    .drawer-section-title {
      font-size: 0.6rem; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .drawer-section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .drawer-chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .drawer-chip {
      padding: 8px 14px; border-radius: var(--radius);
      border: 1px solid var(--border); background: transparent; color: var(--muted);
      font-family: 'DM Sans', sans-serif; font-size: 0.8rem; font-weight: 500;
      letter-spacing: 0.06em; text-transform: uppercase;
      cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden;
    }
    .drawer-chip.on { border-color: var(--chip-color, var(--accent)); color: var(--chip-color, var(--accent)); }
    .drawer-chip.on::after { content: ''; position: absolute; inset: 0; background: var(--chip-color, var(--accent)); opacity: 0.08; pointer-events: none; }
    .drawer-clear {
      width: 100%; padding: 11px; margin-top: 8px;
      background: transparent; border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--muted); font-family: 'DM Sans', sans-serif;
      font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase;
      cursor: pointer; transition: all 0.2s; font-weight: 500;
    }
    .drawer-clear:hover { border-color: var(--accent); color: var(--accent); }

    @media (max-width: 1024px) { .sidebar { width: 210px; } .main { padding: 30px 26px 60px; } }
    @media (max-width: 768px) {
      .sidebar { display: none; } .mobile-bar { display: flex; }
      .page { flex-direction: column; } .main { padding: 22px 18px 60px; }
      .main-header h1 { font-size: clamp(2rem, 9vw, 3.2rem); }
      .stats { flex-wrap: wrap; }
      .stat { min-width: calc(33.33% - 1px); border-bottom: 1px solid var(--border); }
      .card-body { flex-wrap: wrap; gap: 12px; }
      .card-right { flex-direction: row; align-items: center; width: 100%; justify-content: flex-start; }
      .fc-body { padding: 16px 16px 18px; }
    }
    @media (max-width: 480px) {
      .main { padding: 16px 14px 60px; } .card-body { padding: 14px 16px; }
      .card-name { font-size: 0.88rem; } .card-desc { font-size: 0.78rem; }
      .stats { flex-wrap: wrap; } .stat { min-width: 50%; }
      .header-meta { gap: 10px; } .meta-div { display: none; }
      .fc-name { font-size: 1rem; }
      .pv-badge { top: 8px; left: 8px; padding: 3px 7px; font-size: 0.5rem; }
      .fc-footer { flex-direction: row; align-items: center; }
      .fc-meta { justify-content: flex-start; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::after { animation: none !important; transition: none !important; }
      /* these start at opacity 0 and rely on the fade-in, so keep them visible when it's off */
      .main-header, .tag-bar, .result-count, .featured, .section-label,
      .cards-wrap, .stats { opacity: 1 !important; }
    }
  </style>
</head>
<body>
<div class="page">

  <!-- MOBILE TOP BAR -->
  <div class="mobile-bar" id="mobileBar">
    <div class="mobile-logo">Project <span>Registry</span></div>
    <button class="filter-toggle-btn" id="filterToggleBtn" onclick="openDrawer()">
      <span class="ftb-dot"></span>Filters
    </button>
  </div>

  <!-- FILTER DRAWER (mobile) -->
  <div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
  <div class="drawer" id="filterDrawer">
    <div class="drawer-handle"></div>
    <div class="drawer-header">
      <span class="drawer-title">— Filters</span>
      <button class="drawer-close" onclick="closeDrawer()">✕</button>
    </div>
    <div class="drawer-body">
      <div class="drawer-section">
        <div class="drawer-section-title">Category</div>
        <div class="drawer-chips">
          <button class="drawer-chip" data-g="cat" data-v="web_apps"  style="--chip-color:var(--accent)" onclick="toggleDrawer(this)">Web Apps</button>
          <button class="drawer-chip" data-g="cat" data-v="shop_work" style="--chip-color:#e8e8e8" onclick="toggleDrawer(this)">Shop Work</button>
          <button class="drawer-chip" data-g="cat" data-v="games" style="--chip-color:#7ab8ff" onclick="toggleDrawer(this)">Games</button>
        </div>
      </div>
      <div class="drawer-section">
        <div class="drawer-section-title">Status</div>
        <div class="drawer-chips">
          <button class="drawer-chip" data-g="status" data-v="complete" style="--chip-color:#3ddc6a" onclick="toggleDrawer(this)">Complete</button>
          <button class="drawer-chip" data-g="status" data-v="active"   style="--chip-color:#e8e8e8" onclick="toggleDrawer(this)">Active</button>
          <button class="drawer-chip" data-g="status" data-v="wip"      style="--chip-color:#ff9f1c" onclick="toggleDrawer(this)">In Progress</button>
          <button class="drawer-chip" data-g="status" data-v="retired"  style="--chip-color:#5a5a66" onclick="toggleDrawer(this)">Retired</button>
        </div>
      </div>
      <button class="drawer-clear" onclick="clearAll()">⟳ &nbsp;Clear All Filters</button>
    </div>
  </div>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-tag">— Portfolio</div>
      <h2>Project<br><span>Registry</span></h2>
      <div class="title-underline"></div>
    </div>

    <div class="filter-section">
      <div class="filter-title">Category</div>
      <div class="chip-list">
        <button class="chip" data-g="cat" data-v="web_apps" style="--chip-color:var(--accent)" onclick="toggle(this)">
          <span class="chip-dot"></span><span class="chip-label">Web Apps</span>
          <span class="chip-check">✓</span>
        </button>
        <button class="chip" data-g="cat" data-v="shop_work" style="--chip-color:#e8e8e8" onclick="toggle(this)">
          <span class="chip-dot"></span><span class="chip-label">Shop Work</span>
          <span class="chip-check">✓</span>
        </button>
        <button class="chip" data-g="cat" data-v="games" style="--chip-color:#7ab8ff" onclick="toggle(this)">
          <span class="chip-dot"></span><span class="chip-label">Games</span>
          <span class="chip-check">✓</span>
        </button>
      </div>
    </div>

    <div class="filter-section">
      <div class="filter-title">Status</div>
      <div class="chip-list">
        <button class="chip" data-g="status" data-v="complete" style="--chip-color:#3ddc6a" onclick="toggle(this)">
          <span class="chip-dot"></span><span class="chip-label">Complete</span>
          <span class="chip-check">✓</span>
        </button>
        <button class="chip" data-g="status" data-v="active" style="--chip-color:#e8e8e8" onclick="toggle(this)">
          <span class="chip-dot"></span><span class="chip-label">Active</span>
          <span class="chip-check">✓</span>
        </button>
        <button class="chip" data-g="status" data-v="wip" style="--chip-color:#ff9f1c" onclick="toggle(this)">
          <span class="chip-dot"></span><span class="chip-label">In Progress</span>
          <span class="chip-check">✓</span>
        </button>
        <button class="chip" data-g="status" data-v="retired" style="--chip-color:#5a5a66" onclick="toggle(this)">
          <span class="chip-dot"></span><span class="chip-label">Retired</span>
          <span class="chip-check">✓</span>
        </button>
      </div>
    </div>

    <button class="clear-btn" onclick="clearAll()">⟳ &nbsp;Clear All Filters</button>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="season-banner" id="seasonBanner" role="status" aria-live="polite"></div>
    <div class="main-header">
      <h1>All<br><span>Projects</span></h1>
      <div class="header-underline"></div>
      <div class="header-meta">
        <span class="meta-item">Personal Portfolio</span>
        <div class="meta-div"></div>
        <span class="meta-item" id="totalCount">0 Projects</span>
        <div class="meta-div"></div>
        <span class="meta-item" id="ds"></span>
      </div>
    </div>

    <div class="tag-bar" id="tagBar"></div>
    <div class="result-count" id="rc"><em id="vc">0</em> projects shown</div>

    <!-- FEATURED: any project whose tags include "Featured" -->
    <section class="featured" id="featured" aria-label="Featured projects">
      <div class="featured-head">
        <span class="featured-title"><i>★</i> Featured</span>
      </div>
      <div class="featured-grid" id="featuredGrid"></div>
    </section>

    <div class="section-label" id="moreHead">More Projects</div>

    <div class="featured-grid more-grid" id="moreGrid"></div>
    <div class="cards-wrap" id="cardsWrap"></div>

  const isFeatured = p => (p.tags || []).some(t => String(t).toLowerCase() === 'featured');
  // non-featured, non-retired projects with a preview clip get a big card in More Projects
  const isBigMore = p => !isFeatured(p) && p.status !== 'retired' && !!p.previewVideo;

  document.getElementById('totalCount').textContent = DATA.length + ' Projects';

  const F = { cat: new Set(), status: new Set() };
  const CHIP_BG = {
    web_apps:  `rgba(${ACCENT_RGB},0.1)`,
    shop_work: 'rgba(232,232,232,0.08)',
    games:     'rgba(122,184,255,0.1)',
    complete:  'rgba(61,220,106,0.12)',
    active:    'rgba(232,232,232,0.08)',

    retired:   'rgba(90,90,102,0.15)',
  };

  function toggle(btn) {
    const g = btn.dataset.g, v = btn.dataset.v;
    if (F[g].has(v)) { F[g].delete(v); btn.classList.remove('on'); }
    else             { F[g].add(v);    btn.classList.add('on'); }
    apply();
  }

  function clearAll() {
    Object.keys(F).forEach(g => F[g].clear());
    document.querySelectorAll('.chip.on').forEach(c => c.classList.remove('on'));
    document.querySelectorAll('.drawer-chip.on').forEach(c => c.classList.remove('on'));

  function removeFilter(g, v) {
    F[g].delete(v);
    const btn = document.querySelector(`.chip[data-g="${g}"][data-v="${v}"]`);
    if (btn) btn.classList.remove('on');

  }

  function apply() {
    const cards = document.querySelectorAll('.project-card, .featured-card');
    let vis=0, webApps=0, shopWork=0, games=0, visFeat=0, visReg=0;
    cards.forEach(c => {
      const ok = (F.cat.size===0 || F.cat.has(c.dataset.cat)) && (F.status.size===0 || F.status.has(c.dataset.status));
      c.classList.toggle('hide', !ok);
      if (ok) {
        vis++;
        if (c.classList.contains('featured-card') && !c.classList.contains('more-card')) visFeat++; else visReg++;
        if (c.dataset.cat==='web_apps') webApps++;
        if (c.dataset.cat==='shop_work') shopWork++;
        if (c.dataset.cat==='games') games++;
      }
    });
    const fs = document.getElementById('featured');
    if (fs) fs.classList.toggle('hide', visFeat === 0);
    const mh = document.getElementById('moreHead');
    if (mh) mh.classList.toggle('hide', !(FEAT_COUNT > 0 && visFeat > 0 && visReg > 0));
    document.getElementById('vc').textContent = vis;
    document.getElementById('sTotal').textContent = vis;
    document.getElementById('sWebApps').textContent = webApps;
    document.getElementById('sShopWork').textContent = shopWork;
    document.getElementById('sGames').textContent = games;
    document.getElementById('empty').classList.toggle('show', vis===0);
    const bar = document.getElementById('tagBar');
    bar.innerHTML='';
    const all = [...[...F.cat].map(v=>({g:'cat',v})), ...[...F.status].map(v=>({g:'status',v}))];
    all.forEach(({g,v})=>{
      const color = CAT_COLOR[v] || STATUS_COLOR[v] || '#fff';
      const label = CAT_LABEL[v] || STATUS_LABEL[v] || v;
      const t = document.createElement('div');
      t.className='atag';
      t.style.background = CHIP_BG[v]||'rgba(255,255,255,0.06)';
      t.style.border = `1px solid ${color}55`;
      t.style.color  = color;
      t.innerHTML = `${label.toUpperCase()} <span class="atag-x" onclick="removeFilter('${g}','${v}')">✕</span>`;
      bar.appendChild(t);
    });
    syncDrawerChips();
  }

  function openDrawer() { document.getElementById('filterDrawer').classList.add('open'); document.getElementById('drawerOverlay').classList.add('open'); document.body.style.overflow = 'hidden'; }
  function closeDrawer() { document.getElementById('filterDrawer').classList.remove('open'); document.getElementById('drawerOverlay').classList.remove('open'); document.body.style.overflow = ''; }
  function toggleDrawer(btn) {
    const g = btn.dataset.g, v = btn.dataset.v;
    if (F[g].has(v)) { F[g].delete(v); btn.classList.remove('on'); } else { F[g].add(v); btn.classList.add('on'); }
    const sideChip = document.querySelector(`.chip[data-g="${g}"][data-v="${v}"]`);
    if (sideChip) sideChip.classList.toggle('on', F[g].has(v));
    apply();
  }
  function syncDrawerChips() {
    document.querySelectorAll('.drawer-chip').forEach(btn => btn.classList.toggle('on', F[btn.dataset.g].has(btn.dataset.v)));

    const ftb = document.getElementById('filterToggleBtn');
    if (ftb) ftb.classList.toggle('has-filters', hasAny);

  /* ════════════════════════════════════════════════════════════
     ANIMATED PREVIEWS
     Each featured card plays a 15-second looping scene built in the
     page itself (SVG + Web Animations API). Scenes pause when they
     scroll out of view, and show a still frame if the visitor prefers
     reduced motion. To use a recorded clip instead, set previewVideo.
     ════════════════════════════════════════════════════════════ */
  const REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const LOOP = 15;           // seconds
  const ACC = cssVar('--accent') || '#c8ff00', MUT = '#8a8a9a', INK = '#0d0d0f';
  let uid = 0;

  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function makeAnimator() {
    const list = [];
    const ok = !REDUCED && typeof Element.prototype.animate === 'function';
    return {
      list,
      // timeline: frames = [[seconds, {css}], ...] across the 15s loop
      tl(el, frames, ease) {
        if (!el || !ok) return;
        const kfs = frames.map(([t, s]) => Object.assign({ offset: Math.max(0, Math.min(1, t / LOOP)) }, s));
        if (kfs[0].offset > 0) kfs.unshift(Object.assign({}, kfs[0], { offset: 0 }));
        if (kfs[kfs.length - 1].offset < 1) kfs.push(Object.assign({}, kfs[kfs.length - 1], { offset: 1 }));
        kfs.forEach(k => { k.easing = ease || 'linear'; });
        list.push(el.animate(kfs, { duration: LOOP * 1000, iterations: Infinity }));
      },
      // short repeating loop (scrolling, spinning wheels, snow…)
      loop(el, frames, ms, delay) {
        if (!el || !ok) return;
        list.push(el.animate(frames, { duration: ms, iterations: Infinity, easing: 'linear', delay: delay || 0 }));
      },
    };
  }
  const origin = (els, o) => els.forEach(e => { e.style.transformBox = 'fill-box'; e.style.transformOrigin = o; });

  const SVG_OPEN = 'class="pv-svg" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"';

  /* ── Scene: Snowboard ── */
  function sceneSnowboard(host, p, A) {
    const slope = 0.28125;   // ridge and rider line share this slope
    const tree = (x, gy, s, fill) => {
      const h = 74 * s, w = 15 * s;
      return `<rect x="${x - 2*s}" y="${gy - 8*s}" width="${4*s}" height="${12*s}" fill="#2a1a12"/>
        <polygon points="${x},${gy - h} ${x - w},${gy - h*0.52} ${x + w},${gy - h*0.52}" fill="${fill}"/>
        <polygon points="${x},${gy - h*0.72} ${x - w*1.4},${gy - h*0.2} ${x + w*1.4},${gy - h*0.2}" fill="${fill}"/>
        <polygon points="${x},${gy - h} ${x - w*0.45},${gy - h*0.8} ${x + w*0.45},${gy - h*0.8}" fill="#eef4fa"/>`;
    };
    let trees = '', bumps = '', flakes = '';
    for (let i = -1; i <= 5; i++) {
      const x1 = i*160 + 20, x2 = i*160 + 105;
      trees += tree(x1, 120 + slope*x1, 1, '#16392a') + tree(x2, 120 + slope*x2, 0.78, '#10291f');
      const bx = i*160 + 60;
      bumps += `<ellipse cx="${bx}" cy="${168 + slope*bx}" rx="26" ry="3.2" fill="#f4f8fc" opacity=".85"/>
                <ellipse cx="${bx+80}" cy="${232 + slope*(bx+80)}" rx="18" ry="2.6" fill="#f4f8fc" opacity=".7"/>`;
    }
    for (let i = 0; i < 18; i++) {
      const x = (i * 97) % 700 - 30, r = 1 + (i % 3) * 0.8;
      flakes += `<circle class="sb-flake" cx="${x}" cy="-10" r="${r}" fill="#fff" opacity=".8"/>`;
    }
    const popStyle = `font-family="Bebas Neue, sans-serif" font-size="50" letter-spacing="2" text-anchor="middle" fill="${ACC}" stroke="${INK}" stroke-width="5" paint-order="stroke" style="opacity:0"`;
    host.insertAdjacentHTML('afterbegin', `
      <svg ${SVG_OPEN} aria-hidden="true">
        <defs><linearGradient id="sbSky${uid}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0a0f1f"/><stop offset="1" stop-color="#2b3a5e"/></linearGradient></defs>
        <rect width="640" height="360" fill="url(#sbSky${uid})"/>
        <circle cx="530" cy="62" r="22" fill="#e8e8e8" opacity=".92"/>
        <polygon points="0,200 90,105 170,185 260,92 360,200 450,118 560,205 640,140 640,360 0,360" fill="#1a2440"/>
        <g class="sb-scroll">${trees}</g>
        <polygon points="0,120 640,300 640,360 0,360" fill="#dfe9f3"/>
        <polygon points="0,150 640,330 640,360 0,360" fill="#cfdcea" opacity=".65"/>
        <g class="sb-scroll">${bumps}</g>
        <path d="M0 190 L640 370" stroke="#aebfd4" stroke-width="2" opacity=".7"/>
        <g transform="translate(320 280) rotate(15.7)">
          <ellipse cx="0" cy="4" rx="28" ry="3" fill="#7f93ac" opacity=".55"/>
          <circle class="sb-sp" cx="-34" cy="-3" r="2.6" fill="#fff"/>
          <circle class="sb-sp" cx="-34" cy="-6" r="2" fill="#fff"/>
          <circle class="sb-sp" cx="-34" cy="-1" r="1.6" fill="#fff"/>
          <g class="sb-rider">
            <rect x="-28" y="-5" width="56" height="6" rx="3" fill="${ACC}"/>
            <path d="M-9 -5 L-5 -24 M9 -5 L8 -24" stroke="#1d2433" stroke-width="6" stroke-linecap="round" fill="none"/>
            <path d="M0 -22 L0 -44" stroke="#e8e8e8" stroke-width="10" stroke-linecap="round" fill="none"/>
            <path d="M-2 -40 L-17 -31 M2 -40 L17 -34" stroke="#e8e8e8" stroke-width="4.5" stroke-linecap="round" fill="none"/>
            <circle cx="0" cy="-53" r="6.5" fill="#f1c9a5"/>
            <path d="M-7.5 -53 a7.5 7.5 0 0 1 15 0 z" fill="#1d2433"/>
            <rect x="1" y="-55" width="7" height="3.6" rx="1.6" fill="${ACC}"/>
          </g>
        </g>
        <text class="sb-pop" x="320" y="150" ${popStyle}>360°</text>
        <text class="sb-pop" x="320" y="150" ${popStyle}>GRAB!</text>
        ${flakes}
      </svg>`);
    const q = s => [...host.querySelectorAll(s)];
    uid++;

    // scenery slides up the slope (one tree-period every 5s → 3 seamless loops per 15s)
    q('.sb-scroll').forEach(g => A.loop(g, [{ transform: 'translate(0px,0px)' }, { transform: 'translate(-160px,-45px)' }], 5000));

    // rider: carve → 360 jump → carve → grab jump → carve
    const rider = host.querySelector('.sb-rider');
    rider.style.transformOrigin = '0px -26px';
    const R = (y, r) => ({ transform: `translateY(${y}px) rotate(${r}deg)` });
    A.tl(rider, [
      [0, R(0, -3)], [1.8, R(-1, 3)], [3.5, R(0, -3)],
      [3.9, R(3, -6)], [4.3, R(-14, -30)], [5.2, R(-64, -190)], [6.1, R(-14, -330)], [6.4, R(0, -360)],
      [6.41, R(0, 0)], [8, R(-1, 3)], [9.5, R(0, -3)],
      [10, R(3, -5)], [10.6, R(-30, 8)], [11.4, R(-46, -14)], [12.2, R(-26, 6)], [12.7, R(0, -2)],
      [13.8, R(-1, 3)], [15, R(0, -3)],
    ], 'ease-in-out');

    // trick call-outs
    const pops = q('.sb-pop');
    origin(pops, 'center');
    const pop = (el, t0, t1) => A.tl(el, [
      [0, { opacity: 0, transform: 'scale(.5)' }], [t0, { opacity: 0, transform: 'scale(.5)' }],
      [t0 + .25, { opacity: 1, transform: 'scale(1.15)' }], [t0 + .5, { opacity: 1, transform: 'scale(1)' }],
      [t1, { opacity: 1, transform: 'scale(1)' }], [t1 + .3, { opacity: 0, transform: 'scale(1)' }],
    ], 'ease-out');
    pop(pops[0], 4.9, 6.1);
    pop(pops[1], 11.0, 12.2);

    // snow spray + falling flakes
    q('.sb-sp').forEach((c, i) => A.loop(c,
      [{ transform: 'translate(0px,0px)', opacity: .9 }, { transform: 'translate(-26px,-8px)', opacity: 0 }], 700, -i * 230));
    q('.sb-flake').forEach((c, i) => {
      const dur = 3200 + (i % 4) * 500;
      A.loop(c, [{ transform: 'translate(0px,0px)' }, { transform: 'translate(-40px,390px)' }], dur, -((i * 377) % dur));
    });
  }

  /* ── Scene: Insert Master (decode "CNMG 120408") ── */
  function sceneInsert(host, p, A) {
    const u = 'im' + (uid++);
    const letters = [['C',150,3.0],['N',200,4.5],['M',250,6.0],['G',300,7.5],['12',385,9.0],['04',445,10.2],['08',505,11.4]];
    const callouts = [
      { t: 3.0, ax: 320, ay: 109, lx: 440, ly: 128, end: false, label: '80° DIAMOND' },
      { t: 4.5, ax: 280, ay: 152, lx: 196, ly: 134, end: true,  label: '0° CLEARANCE' },
      { t: 6.0, ax: 280, ay: 248, lx: 196, ly: 272, end: true,  label: '±0.08 TOLERANCE' },
      { t: 7.5, ax: 334, ay: 200, lx: 440, ly: 206, end: false, label: 'HOLE + BREAKER' },
    ];
    const chips = [
      { t: 9.0,  x: 130, label: 'IC 12.7 MM' },
      { t: 10.2, x: 260, label: 'THK 4.76 MM' },
      { t: 11.4, x: 390, label: 'NOSE R 0.8' },
    ];
    const lt = letters.map(([s, x]) =>
      `<text class="im-l" x="${x}" y="84" text-anchor="middle" font-family="Bebas Neue, sans-serif" font-size="40" letter-spacing="2" fill="${ACC}">${s}</text>`).join('');
    const co = callouts.map(c => {
      const ex = c.end ? c.lx + 6 : c.lx - 6;
      return `<g class="im-co">
        <line x1="${c.ax}" y1="${c.ay}" x2="${ex}" y2="${c.ly - 4}" stroke="${ACC}" stroke-width="1.3"/>
        <circle cx="${c.ax}" cy="${c.ay}" r="3.2" fill="${ACC}"/>
        <text x="${c.lx}" y="${c.ly}" text-anchor="${c.end ? 'end' : 'start'}" font-family="DM Sans, sans-serif" font-size="15" font-weight="500" letter-spacing="1.4" fill="#e8e8e8">${c.label}</text>
      </g>`;
    }).join('');
    const ch = chips.map(c => `<g class="im-chip">
        <rect x="${c.x}" y="322" width="120" height="26" rx="5" fill="none" stroke="${ACC}" stroke-width="1.2"/>
        <text x="${c.x + 60}" y="340" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="12.5" font-weight="500" letter-spacing="1.2" fill="#e8e8e8">${c.label}</text>
      </g>`).join('');
    host.insertAdjacentHTML('afterbegin', `
      <svg ${SVG_OPEN} aria-hidden="true">
        <defs><pattern id="${u}g" width="32" height="32" patternUnits="userSpaceOnUse">
          <path d="M32 0H0V32" fill="none" stroke="#1b1b22" stroke-width="1"/></pattern></defs>
        <rect width="640" height="360" fill="#0a0a0e"/>
        <rect width="640" height="360" fill="url(#${u}g)"/>
        ${lt}

  const SCENES = { snowboard: sceneSnowboard, insert: sceneInsert, car: sceneCar, generic: sceneGeneric };

  // play only while on screen
  function setPlaying(host, on) {
    (host.__anims || []).forEach(a => { try { on ? a.play() : a.pause(); } catch (e) {} });
    if (host.__video) { on ? host.__video.play().catch(() => {}) : host.__video.pause(); }
  }
  const io = 'IntersectionObserver' in window
    ? new IntersectionObserver(es => es.forEach(e => setPlaying(e.target, e.isIntersecting)), { threshold: 0.2 })
    : null;

  function mountPreview(host, p) {
    const A = makeAnimator();
    if (p.previewVideo) {
      const v = document.createElement('video');
      v.className = 'pv-video';
      v.src = p.previewVideo;
      v.muted = true; v.loop = true; v.playsInline = true; v.preload = 'auto';
      if (p.previewPoster) v.poster = p.previewPoster;
      host.insertBefore(v, host.firstChild);
      if (!REDUCED) host.__video = v;
    } else {
      (SCENES[p.previewScene] || SCENES.generic)(host, p, A);
    }
    host.__anims = A.list;
    if (io) io.observe(host);
    else if (host.__video) host.__video.play().catch(() => {});
  }

      const mobileSymbol = p.mobileCompat ? '<span class="compat-symbol compat-check">✓</span>' : '<span class="compat-symbol compat-x">✗</span>';

        ? `<a class="open-btn" href="${p.url}" aria-label="Open ${p.name}">Open <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i></a>`
        : `<span class="open-btn disabled">Coming soon</span>`;

  /* ── Seasonal banner + floating decorations (only while a season is active) ── */
  (function seasonFx() {
    const season = document.documentElement.getAttribute('data-season-name');
    if (!season) return;
    const T = {
      halloween:  { text: '<b>Happy Halloween</b> · enjoy the spooky season', icon: '🎃', bits: ['🎃','🦇','👻','🕸️','🎃','🦇'], mode: 'fall' },
      christmas:  { text: '<b>Happy Holidays</b> · merry &amp; bright',       icon: '🎄', bits: ['❄️','❄️','🎄','⭐','❄️','🎁'], mode: 'fall' },
      newyear:    { text: '<b>Happy New Year</b> · cheers to a great one',     icon: '🎆', bits: ['🎆','🎉','✨','🥂','🎇','✨'], mode: 'twinkle' },
      stpatricks: { text: "<b>Happy St. Patrick's Day</b> · lucky you",        icon: '☘️', bits: ['🍀','☘️','🍀','🌈','🍀','☘️'], mode: 'fall' },
      july4:      { text: '<b>Happy 4th of July</b> · stars &amp; stripes',    icon: '🎆', bits: ['🎆','⭐','🎇','🇺🇸','✨','⭐'], mode: 'twinkle' }
    }[season];
    if (!T) return;
    const banner = document.getElementById('seasonBanner');
    if (banner) banner.innerHTML = '<span aria-hidden="true">' + T.icon + '</span><span>' + T.text + '</span>';
    if (REDUCED) return;
    const fx = document.createElement('div');
    fx.id = 'seasonFx'; fx.setAttribute('aria-hidden', 'true');
    if (T.mode === 'twinkle') fx.classList.add('twinkle');
    const small = window.innerWidth < 700, n = small ? 9 : 16;
    for (let k = 0; k < n; k++) {
      const el = document.createElement('i');
      el.textContent = T.bits[k % T.bits.length];
      const size = 16 + Math.random() * 16;
      el.style.left = (Math.random() * 98) + 'vw';
      el.style.fontSize = size + 'px';
      if (T.mode === 'twinkle') {
        el.style.top = (4 + Math.random() * 88) + 'vh';
        el.style.animationDuration = (2.2 + Math.random() * 3.2) + 's';
      } else {
        el.style.animationDuration = (11 + Math.random() * 12) + 's';
        el.style.setProperty('--sway', (Math.random() * 70 - 35) + 'px');
        el.style.setProperty('--spin', (Math.random() * 360 - 180) + 'deg');
      }
      el.style.animationDelay = (-Math.random() * 20) + 's';
      fx.appendChild(el);
    }
    // particles removed: the floating decorations are no longer added to the page
  })();

  /* ── Holiday theme switch ── */
  (function seasonSwitch() {
    const root = document.documentElement, btn = document.getElementById('seasonToggle'), name = root.getAttribute('data-season-name');
    if (!btn || !name) return;
    const sync = () => { const on = root.hasAttribute('data-season'); btn.setAttribute('aria-pressed', String(on)); btn.querySelector('.tt-l').textContent = 'Holiday theme: ' + (on ? 'on' : 'off'); };
    btn.addEventListener('click', () => {
      const on = root.hasAttribute('data-season');
      if (on) root.removeAttribute('data-season'); else root.setAttribute('data-season', name);
      try { localStorage.setItem('portfolio-season', on ? 'off' : 'on'); } catch (e) {}
      sync();
    });
    sync();
  })();

  /* ── Tilt: a fixed angle (never changes with scroll). The only thing script adjusts is the scale, shrinking the tilted grid just enough
        that its right edge (the side swung toward the viewer) always stays on screen, so no card is cut off. ── */
  (function tiltUi() {
    const root = document.documentElement, btn = document.getElementById('tiltToggle');
    const main = document.querySelector('.main'), MARGIN = 14, S_MAX = 0.92, S_MIN = 0.45;
    const sync = () => { const on = root.getAttribute('data-tilt') === 'on'; if (btn) { btn.setAttribute('aria-pressed', String(on)); btn.querySelector('.tt-l').textContent = 'Tilt: ' + (on ? 'on' : 'off'); } };
    const side = document.querySelector('.sidebar');
    const right = () => { let r = 0; for (const c of main.children) { if (!c.offsetParent && getComputedStyle(c).position !== 'fixed') continue; const b = c.getBoundingClientRect(); if (b.width) r = Math.max(r, b.right); } return r; };
    const left = () => side.getBoundingClientRect().left;
    // largest scale (up to max) at which over() is still false; the properties are set and measured synchronously, so nothing is ever painted mid-search
    function shrink(prop, max, over) {
      root.style.setProperty(prop, max); main.getBoundingClientRect();
      if (!over()) return;
      let lo = S_MIN, hi = max;
      for (let k = 0; k < 9; k++) { const m = (lo + hi) / 2; root.style.setProperty(prop, m); main.getBoundingClientRect(); if (over()) hi = m; else lo = m; }
      root.style.setProperty(prop, lo.toFixed(4));
    }
    function fit() {
      if (!main || !side) return;
      const tilted = root.getAttribute('data-tilt') === 'on' && getComputedStyle(main).transform !== 'none';
      if (!tilted) { root.style.removeProperty('--tilt-s'); root.style.removeProperty('--tilt-sb'); return; }
      const lim = document.documentElement.clientWidth - MARGIN;
      shrink('--tilt-s', S_MAX, () => right() > lim);
      shrink('--tilt-sb', 0.94, () => left() < 2);
    }
    if (btn) btn.addEventListener('click', () => {
      const next = root.getAttribute('data-tilt') === 'on' ? 'off' : 'on';
      root.setAttribute('data-tilt', next); try { localStorage.setItem('portfolio-tilt', next); } catch (e) {}
      sync(); fit();
    });
    // keep the vanishing point fixed relative to the screen (it is measured down the page), so the slant is the same at every scroll position
    const page = document.querySelector('.page');
    function pin() { if (!page) return; root.style.setProperty('--tilt-py', Math.round(Math.min(window.innerHeight * 0.5, 480) - page.getBoundingClientRect().top) + 'px'); }
    addEventListener('scroll', pin, { passive: true }); addEventListener('resize', pin);
    pin(); sync(); fit();
    addEventListener('resize', fit);
    if (window.ResizeObserver && main) new ResizeObserver(fit).observe(main);
    addEventListener('load', fit);
  })();
</script>
</body>
</html>

<body>
<header class="site-head" role="banner"><a href="https://kevmcg1.github.io/portfolio" target="_top" aria-label="Back to the portfolio at kevmcg1.github.io">KEVMCG1.GITHUB.IO</a></header>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, vehicleGroup, carBodyGroup, floor, sunLight;
        const wheels = []; 
        const frontWheelGroups = []; 
        const pushables = []; 
        
        const zoom = 15; 
        const keys = { w: false, a: false, s: false, d: false, arrowup: false, arrowdown: false, arrowleft: false, arrowright: false, ' ': false };
        
        /* Vehicle physics. 1 scene unit is about 1 metre. Everything is in real seconds and the
           simulation runs on a fixed 120 Hz step, so the car drives identically on a 60 Hz phone, a
           144 Hz monitor or a slow machine that drops frames. */
        const STEP = 1 / 120;
        const MAX_FRAME = 0.1;           // never try to catch up more than this after a stall (tab switch, etc.)
        const WHEELBASE = 2.5;
        const MAX_SPEED = 30;            // top speed forward (about 108 km/h)
        const MAX_REVERSE = 9;
        const ENGINE_ACCEL = 14;         // pull away from a stop; tapers off toward top speed
        const REVERSE_ACCEL = 8;
        const BRAKE_DECEL = 34;
        const ROLL_RESIST = 1.4;         // rolling resistance, u/s^2
        const AERO_DRAG = 0.0035;        // quadratic drag
        const GRIP = 9;                  // how fast sideways slip is killed (1/s)
        const HANDBRAKE_GRIP = 1.6;      // rear grip with the handbrake: the car slides
        const MAX_STEER = 0.62;          // front wheel angle at a standstill, rad
        const STEER_RATE = 3.2;          // how fast the wheels turn, rad/s
        const STEER_RETURN = 5.0;
        const GRAVITY = -30;
        let vel = null;                  // car velocity (x, z), set in init
        let heading = 0;
        let steerAngle = 0;
        let lastAccel = 0, lastLat = 0;
        let currentPitch = 0, currentRoll = 0;
        let simTime = 0, lastNow = 0, acc = 0;
        let spinAngle = 0;
        const camFollow = { x: 0, z: 0 };
        const FLOOR_Y = 0.75; 

        function createCheckerTexture() {
            const size = 1024;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            const checkers = 4; 
            const step = size / checkers;
            const gutter = 16; 

            ctx.fillStyle = '#0a0a0a'; 
            ctx.fillRect(0, 0, size, size);

            for (let i = 0; i < checkers; i++) {
                for (let j = 0; j < checkers; j++) {
                    ctx.fillStyle = (i + j) % 2 === 0 ? '#181818' : '#202020';
                    ctx.fillRect(i * step + gutter/2, j * step + gutter/2, step - gutter, step - gutter);
                }
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(100, 100); 
            texture.anisotropy = 16;
            return texture;
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);

            const aspect = window.innerWidth / window.innerHeight;
            camera = new THREE.OrthographicCamera(-zoom * aspect, zoom * aspect, zoom, -zoom, 0.1, 1000);
            
            const radius = 100;
            camera.position.set(radius, radius, radius);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
            scene.add(ambientLight);

            sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
            sunLight.position.set(40, 100, 20); 
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.left = -60;
            sunLight.shadow.camera.right = 60;
            sunLight.shadow.camera.top = 60;
            sunLight.shadow.camera.bottom = -60;
            scene.add(sunLight);

            const floorGeom = new THREE.PlaneGeometry(2000, 2000);
            const floorMat = new THREE.MeshStandardMaterial({ 
                map: createCheckerTexture(),
                roughness: 0.7, 
                metalness: 0.05 
            });
            floor = new THREE.Mesh(floorGeom, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            vel = new THREE.Vector2(0, 0);
            createCar();
            createPushables();

            window.addEventListener('keydown', (e) => { const k = e.key.toLowerCase(); if (k in keys) keys[k] = true; });
            window.addEventListener('keyup', (e) => { const k = e.key.toLowerCase(); if (k in keys) keys[k] = false; });
            window.addEventListener('resize', onWindowResize, false);

            animate();
        }

        function createPushables() {
            const cubeGeom = new THREE.BoxGeometry(1.5, 1.5, 1.5);
            const colors = [0xcccccc, 0xaaaaaa, 0x4facfe];
            
            for (let i = 0; i < 8; i++) {
                for (let j = 0; j < 8; j++) {
                    const stackHeight = Math.random() > 0.7 ? 2 : 1;
                    
                    for (let h = 0; h < stackHeight; h++) {
                        const mat = new THREE.MeshStandardMaterial({ 
                            color: colors[Math.floor(Math.random() * colors.length)], 
                            roughness: 0.6 
                        });
                        const cube = new THREE.Mesh(cubeGeom, mat);
                        
                        const x = i * 4 - 14 + (Math.random() - 0.5);
                        const z = j * 4 + 15 + (Math.random() - 0.5);
                        const y = FLOOR_Y + (h * 1.51); 

                        cube.position.set(x, y, z);
                        cube.castShadow = true;
                        cube.receiveShadow = true;
                        
                        cube.userData = {
                            velocity: new THREE.Vector3(0, 0, 0),
                            rotVel: new THREE.Vector3(0, 0, 0),
                            mass: 0.8
                        };
                        
                        scene.add(cube);
                        pushables.push(cube);
                    }
                }
            }
        }

        function createCar() {
            vehicleGroup = new THREE.Group();
            scene.add(vehicleGroup);

            carBodyGroup = new THREE.Group();
            vehicleGroup.add(carBodyGroup);

            const paintMat = new THREE.MeshStandardMaterial({ color: 0x4facfe, roughness: 0.1, metalness: 0.8 });
            const glassMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.0, metalness: 1.0, transparent: true, opacity: 0.8 });
            const trimMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.5, metalness: 0.2 });

            const chassis = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.6, 3.5), paintMat);
            chassis.position.y = 0.7;
            chassis.castShadow = true;
            chassis.receiveShadow = true;
            carBodyGroup.add(chassis);

            const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.7, 1.8), paintMat);
            cabin.position.set(0, 1.35, -0.2);
            cabin.castShadow = true;
            carBodyGroup.add(cabin);

            const windshield = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.6, 0.1), glassMat);
            windshield.position.set(0, 1.35, 0.71);
            windshield.rotation.x = -Math.PI * 0.12;
            carBodyGroup.add(windshield);

            const wheelGeom = new THREE.CylinderGeometry(0.5, 0.5, 0.4, 32);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
            
            const wheelPositions = [
                { x: -1.15, y: 0.5, z: 1.25, isFront: true },  
                { x: 1.15, y: 0.5, z: 1.25, isFront: true },   
                { x: -1.15, y: 0.5, z: -1.25, isFront: false }, 
                { x: 1.15, y: 0.5, z: -1.25, isFront: false }   
            ];

            wheelPositions.forEach(pos => {
                const pivot = new THREE.Group();
                pivot.position.set(pos.x, pos.y, pos.z);
                vehicleGroup.add(pivot);

                const wheel = new THREE.Mesh(wheelGeom, wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.castShadow = true;
                pivot.add(wheel);

                wheels.push(wheel);
                if (pos.isFront) {
                    frontWheelGroups.push(pivot);
                }
            });
        }

        function stepCar(dt) {
            const fwdKey = keys.w || keys.arrowup;
            const bwdKey = keys.s || keys.arrowdown;
            const left = keys.a || keys.arrowleft;
            const right = keys.d || keys.arrowright;
            const handbrake = keys[' '];

            // heading basis: forward and right on the ground plane
            const fx = Math.sin(heading), fz = Math.cos(heading);
            const rx = fz, rz = -fx;
            let vf = vel.x * fx + vel.y * fz;       // along the car
            let vr = vel.x * rx + vel.y * rz;       // sideways slip

            // --- throttle, brake, resistance ---
            let a = 0;
            if (fwdKey && !bwdKey) {
                if (vf < -0.5) a = BRAKE_DECEL;                               // still rolling backwards: brake first
                else a = ENGINE_ACCEL * Math.max(0, 1 - vf / MAX_SPEED);      // power tapers toward top speed
            } else if (bwdKey && !fwdKey) {
                if (vf > 0.5) a = -BRAKE_DECEL;                               // rolling forwards: this is the brake
                else a = -REVERSE_ACCEL * Math.max(0, 1 - (-vf) / MAX_REVERSE);
            }
            if (handbrake) a -= Math.sign(vf) * Math.min(Math.abs(vf) / dt, 18);
            const drag = ROLL_RESIST * Math.sign(vf) + AERO_DRAG * vf * Math.abs(vf);
            if (!(fwdKey || bwdKey) || handbrake) {
                // coasting: resistance can slow the car to a stop but never push it the other way
                const dv = drag * dt;
                if (Math.abs(dv) >= Math.abs(vf)) vf = 0; else vf -= dv;
            } else {
                a -= drag;
            }
            vf += a * dt;
            lastAccel += (a - lastAccel) * Math.min(1, 10 * dt);

            // --- steering: a bicycle model. Wheels turn quickly at low speed and less at speed ---
            const limit = MAX_STEER / (1 + Math.abs(vf) / 14);
            const want = left ? limit : right ? -limit : 0;
            const rate = (left || right) ? STEER_RATE : STEER_RETURN;
            const dSteer = want - steerAngle;
            steerAngle += Math.sign(dSteer) * Math.min(Math.abs(dSteer), rate * dt);
            const yawRate = Math.max(-2.6, Math.min(2.6, (vf / WHEELBASE) * Math.tan(steerAngle)));
            heading += yawRate * dt;

            // --- tyres: sideways velocity is scrubbed away, less so on the handbrake ---
            vr *= Math.exp(-(handbrake ? HANDBRAKE_GRIP : GRIP) * dt);
            lastLat += (yawRate * vf - lastLat) * Math.min(1, 10 * dt);

            // rebuild the world velocity from the new heading
            const nfx = Math.sin(heading), nfz = Math.cos(heading);
            vel.x = nfx * vf + nfz * vr;
            vel.y = nfz * vf - nfx * vr;
            vehicleGroup.position.x += vel.x * dt;
            vehicleGroup.position.z += vel.y * dt;
            vehicleGroup.rotation.y = heading;
            spinAngle += (vf / 0.5) * dt;

            // --- the cubes ---
            const carPos = vehicleGroup.position;
            const carRadius = 2.0;
            const sp = Math.hypot(vel.x, vel.y);
            let hits = 0;
            for (let i = 0; i < pushables.length; i++) {
                const cube = pushables[i];
                const u = cube.userData;
                const dx = cube.position.x - carPos.x, dz = cube.position.z - carPos.z;
                // quick reject before the real distance test
                if (Math.abs(dx) < carRadius + 2.5 && Math.abs(dz) < carRadius + 2.5) {
                    const dist = Math.hypot(dx, dz, cube.position.y - carPos.y);
                    if (dist < carRadius + 0.75) {
                        const inv = 1 / (dist || 1);
                        const push = sp * 0.95 + 2.5;
                        u.velocity.x += dx * inv * push * 0.6 + vel.x * 0.5;
                        u.velocity.z += dz * inv * push * 0.6 + vel.y * 0.5;
                        u.velocity.y += 2 + sp * 0.18;
                        u.rotVel.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).multiplyScalar(2 + sp * 0.4);
                        hits++;
                    }
                }
                u.velocity.y += GRAVITY * dt;
                cube.position.x += u.velocity.x * dt;
                cube.position.y += u.velocity.y * dt;
                cube.position.z += u.velocity.z * dt;
                if (cube.position.y < FLOOR_Y) {
                    cube.position.y = FLOOR_Y;
                    u.velocity.y *= -0.3;
                    const f = Math.exp(-5 * dt);                 // ground friction
                    u.velocity.x *= f; u.velocity.z *= f;
                    u.rotVel.multiplyScalar(Math.exp(-6 * dt));
                }
                cube.rotation.x += u.rotVel.x * dt;
                cube.rotation.y += u.rotVel.y * dt;
                cube.rotation.z += u.rotVel.z * dt;
                const damp = Math.exp(-0.5 * dt);
                u.velocity.x *= damp; u.velocity.z *= damp;
                u.rotVel.multiplyScalar(damp);
            }
            // ploughing through cubes costs speed
            if (hits) { const k = Math.exp(-0.35 * hits * dt * 6); vel.x *= k; vel.y *= k; }
        }

        function updateVisuals(frameDt) {
            // body pitch under acceleration and roll in corners, eased in real time
            const targetPitch = -lastAccel * 0.0045;
            currentPitch += (targetPitch - currentPitch) * Math.min(1, 7 * frameDt);
            const targetRoll = -lastLat * 0.006;
            currentRoll += (targetRoll - currentRoll) * Math.min(1, 7 * frameDt);
            carBodyGroup.rotation.x = currentPitch;
            carBodyGroup.rotation.z = currentRoll;
            wheels.forEach(wheel => { wheel.rotation.x = spinAngle; });
            frontWheelGroups.forEach(group => { group.rotation.y = steerAngle; });

            // the camera trails the car a touch instead of being bolted to it
            const k = 1 - Math.exp(-9 * frameDt);
            camFollow.x += (vehicleGroup.position.x - camFollow.x) * k;
            camFollow.z += (vehicleGroup.position.z - camFollow.z) * k;
            camera.position.set(camFollow.x + 80, 80, camFollow.z + 80);
            camera.lookAt(camFollow.x, 0, camFollow.z);
            sunLight.target = vehicleGroup;
            sunLight.position.copy(vehicleGroup.position).add(new THREE.Vector3(40, 100, 20));
        }

        function onWindowResize() {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -zoom * aspect; camera.right = zoom * aspect;
            camera.top = zoom; camera.bottom = -zoom;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate(now) {
            requestAnimationFrame(animate);
            now = (now === undefined ? performance.now() : now) / 1000;
            if (!lastNow) lastNow = now;
            const frameDt = Math.min(MAX_FRAME, Math.max(0, now - lastNow));
            lastNow = now;
            acc += frameDt;
            while (acc >= STEP) { stepCar(STEP); acc -= STEP; }
            updateVisuals(frameDt);
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
